[platformio]
default_envs = native

[env:native]
platform = native
build_flags = 
    -std=gnu11
    -DNATIVE_SIM
    -DCONFIG_FREERTOS_HZ=1000
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/ThirdParty/GCC/Posix
    -I lib/FreeRTOS/portable/ThirdParty/GCC/Posix/utils
    -pthread
    -D_POSIX_C_SOURCE=200809L
    -lm
lib_deps = 
build_src_filter = 
    +<*>
    -<hal_esp32.c>
lib_ldf_mode = chain+
lib_compat_mode = strict

[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
    -std=gnu11
    -DESP32_TARGET
    -I include
lib_deps = 
    adafruit/Adafruit LiquidCrystal@^2.0.2
